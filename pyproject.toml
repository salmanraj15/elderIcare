[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eldericare"
version = "0.1.0"
description = "Privacy-focused acoustic event detection for elder care."
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "matplotlib>=3.11",
    "torch>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]